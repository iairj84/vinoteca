name: Release APK

# Tag a version and the APK builds itself:
#   git tag v1.7.7 && git push origin v1.7.7
# The sideload APK appears on the GitHub release a few minutes later.

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # The app keeps provider keys on the device, so no key should ever be committed.
  # Private repos on this plan have no GitHub secret scanning, so guard here instead.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refuse committed credentials
        run: |
          # Only real key shapes, not the word "key" in prose. Placeholders are ignored.
          PATTERN='AIza[0-9A-Za-z_-]{30,}|gsk_[0-9A-Za-z]{40,}|sk-ant-[0-9A-Za-z_-]{20,}|sk-[A-Za-z0-9]{32,}|gh[pousr]_[0-9A-Za-z]{30,}|github_pat_[0-9A-Za-z_]{20,}|xox[baprs]-[0-9A-Za-z-]{10,}|-----BEGIN [A-Z ]*PRIVATE KEY-----'
          if git grep -nIE "$PATTERN" -- . ':!.github/workflows'; then
            echo "::error::A credential-shaped string is committed. Revoke it at the provider and remove it before merging."
            exit 1
          fi
          echo "No credential patterns found."

      - name: Refuse credential files
        run: |
          BAD=$(git ls-files | grep -iE '(^|/)(local\.properties|google-services\.json|\.env(\..*)?)$|\.(jks|keystore|p12|pem)$' || true)
          if [ -n "$BAD" ]; then
            echo "::error::These files hold secrets or signing material and must not be committed:"
            echo "$BAD"
            exit 1
          fi
          echo "No credential files tracked."

  build:
    needs: secret-scan
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The app installs its own updates, which Android only allows over the same signature.
      # The keystore lives in this repository's secrets, never in the tree.
      - name: Restore the update signing key
        env:
          KEYSTORE: ${{ secrets.SIDELOAD_KEYSTORE }}
          STORE_PASSWORD: ${{ secrets.SIDELOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIDELOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIDELOAD_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::warning::SIDELOAD_KEYSTORE is not set; this APK is debug-signed and cannot install over an earlier release."
            exit 0
          fi
          printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/vinoteca-update.jks"
          {
            echo "SIDELOAD_KEYSTORE_FILE=$RUNNER_TEMP/vinoteca-update.jks"
            echo "SIDELOAD_KEYSTORE_PASSWORD=$STORE_PASSWORD"
            echo "SIDELOAD_KEY_ALIAS=$KEY_ALIAS"
            echo "SIDELOAD_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "Signing with the project key."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action defaults to installing the obsolete `tools` package,
          # which no longer exists and fails the whole step. platform-tools
          # is all we need here; platform + build-tools come next.
          packages: platform-tools

      - name: Install platform and build tools
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Build sideload APK
        run: ./gradlew :app:assembleSideload --no-daemon --console=plain

      - name: Check the version matches the tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CODE=$(grep -oP 'versionCode = \K\d+' app/build.gradle.kts)
          NAME=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "tag=$TAG versionName=$NAME versionCode=$CODE"
          test "$NAME" = "$TAG" || { echo "versionName $NAME does not match tag $TAG"; exit 1; }

      - name: Collect the APK
        run: cp app/build/outputs/apk/sideload/app-sideload.apk "vinoteca-${GITHUB_REF_NAME}.apk"

      - name: Write the release notes
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          awk -v tag="### $TAG:" 'index($0, tag) == 1 { on = 1; next } /^### / { on = 0 } on' README.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "Vinoteca $TAG." > release-notes.md
          fi
          cat release-notes.md

      # GitHub's release API returns 500s often enough that a single call is not a release:
      # v1.7.16 failed twice on exactly this step. `generate_release_notes` calls a second
      # endpoint that 500s too, so the notes are written here and the call is retried.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$GITHUB_REF_NAME"
          FILE="vinoteca-${TAG}.apk"
          ok=0
          for attempt in 1 2 3 4 5; do
            if gh release view "$TAG" >/dev/null 2>&1; then
              if gh release upload "$TAG" "$FILE" --clobber &&
                 gh release edit "$TAG" --draft=false --prerelease=false; then
                ok=1
                break
              fi
            elif gh release create "$TAG" "$FILE" --title "$TAG" \
                   --notes-file release-notes.md --verify-tag; then
              ok=1
              break
            fi
            echo "Attempt $attempt failed; retrying in $((attempt * 15))s."
            sleep $((attempt * 15))
          done
          test "$ok" = "1" || { echo "::error::The release could not be published."; exit 1; }

      # A green run means the APK is downloadable, not just uploaded.
      - name: Check the release is live
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --json isDraft,assets \
            -q '"draft=\(.isDraft) assets=\([.assets[].name] | join(","))"' | tee release-check.txt
          grep -q 'draft=false' release-check.txt
          grep -q "vinoteca-${GITHUB_REF_NAME}.apk" release-check.txt
